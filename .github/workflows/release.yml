name: Release

on:
  push:
    tags: ['v*.*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate four-part tag and manifest version
        run: npm run check -- --tag "$RELEASE_TAG"
      - name: Run tests
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium --no-shell
      - name: Test loaded extension in Chromium
        run: npm run test:browser
      - name: Build extension ZIP
        run: npm run build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Maker · 天一一 $RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.md
